; supervisord configuration for the single-container image (Dockerfile.koyeb).
; Runs php-fpm and nginx as two supervised programs inside one container,
; as required by single-container platforms such as Koyeb, Render and Railway.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/sbin/php-fpm83 -F
priority=10
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startretries=10
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
