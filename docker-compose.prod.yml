# ── Production VM stack ───────────────────────────────────────────────────────
# Database: Aiven MySQL (external — no local mysql container)
# Config:   backend/.env (gitignored — create from .env.example on the VM)
# Start:    docker compose -f docker-compose.prod.yml up -d --build
# Migrate:  docker compose -f docker-compose.prod.yml exec app php artisan migrate --force
# Seed:     docker compose -f docker-compose.prod.yml exec app php artisan db:seed --force

services:
  app:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      minio-init:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      # Console on 9001 is NOT exposed publicly.
      # Access via SSH tunnel: ssh -L 9001:127.0.0.1:9001 user@your-vm
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:-*}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    env_file: ./backend/.env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$${AWS_ACCESS_KEY_ID}" "$${AWS_SECRET_ACCESS_KEY}" &&
      mc mb --ignore-existing local/portfolio &&
      mc anonymous set download local/portfolio

volumes:
  minio-data:
