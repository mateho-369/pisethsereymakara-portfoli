services:
  app:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: {}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
    - 0.0.0.0:8080:80
    volumes:
    - ./backend:/var/www/html:ro
    - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - app
volumes:
  minio-data: null
